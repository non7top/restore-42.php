name: Lint

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  php-syntax:
    name: PHP syntax (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none

      - name: Check syntax
        run: php -l restore-42.php

  phpcs:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP with phpcs
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: phpcs
          coverage: none

      - name: Run phpcs
        run: |
          phpcs --standard=PSR12 \
                --exclude=Generic.Files.LineLength,PSR1.Files.SideEffects \
                --report=full \
                restore-42.php
